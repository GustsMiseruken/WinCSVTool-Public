name: WinCSVTool v0.1.0 package and release
on:
  push:
    branches:
      - release/v0.1.0
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/release/v0.1.0' || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v0.1.0')
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Verify source version and build three packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          if ([string]$props.Project.PropertyGroup.Version -ne '0.1.0') { throw 'Public version is not 0.1.0' }
          ./scripts/publish-portable.ps1 -Version '0.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Verify package shape and sha256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(
            @{ File='WinCSVTool-0.1.0-win-x64-gui-portable.zip'; Root='WinCSVTool-0.1.0-gui-portable'; Exes=@('WinCSVTool.exe') },
            @{ File='WinCSVTool-0.1.0-win-x64-cli-portable.zip'; Root='WinCSVTool-0.1.0-cli-portable'; Exes=@('WinCSVTool.Cli.exe') },
            @{ File='WinCSVTool-0.1.0-win-x64-portable.zip'; Root='WinCSVTool-0.1.0-portable'; Exes=@('WinCSVTool.exe','WinCSVTool.Cli.exe') }
          )
          $hashFile = Get-Content -LiteralPath 'artifacts/WinCSVTool-0.1.0-SHA256SUMS.txt'
          foreach ($package in $packages) {
            $path = Join-Path 'artifacts' $package.File
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing artifact $path" }
            $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not ($hashFile -contains "$sha  $($package.File)")) { throw "Wrong SHA-256 $path" }
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
            try {
              $names = @($zip.Entries | ForEach-Object FullName)
              $shared = @('README.md','THIRD-PARTY-NOTICES.txt','LICENSE','docs/images/main-window.png','data/ip/README.md','data/ip/metadata.json','data/ip/LICENSE-CC-BY-4.0.txt','data/ip/dbip-country-lite-2026-10.mmdb','data/ip/dbip-asn-lite-2026-10.mmdb','data/ip/asn-organizations-2026-10.db')
              $expected = @($shared + $package.Exes | ForEach-Object { "$($package.Root)/$_" })
              if ($names.Count -ne $expected.Count) { throw "Extra or missing entries in $path" }
              foreach ($name in $expected) { if ($name -notin $names) { throw "Missing $name" } }
            }
            finally { $zip.Dispose() }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: WinCSVTool-v0.1.0-review-bundles
          path: |
            artifacts/WinCSVTool-0.1.0-win-x64-gui-portable.zip
            artifacts/WinCSVTool-0.1.0-win-x64-cli-portable.zip
            artifacts/WinCSVTool-0.1.0-win-x64-portable.zip
            artifacts/WinCSVTool-0.1.0-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v0.1.0'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinCSVTool-v0.1.0-review-bundles
          path: release-assets
      - name: Publish three-download release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3
          grep '\.zip$' WinCSVTool-0.1.0-SHA256SUMS.txt | sha256sum -c -
          cat > release-notes.md <<'NOTES'
          WinCSVTool v0.1.0 is a portable Windows x64 CSV and security-log analysis application.

          Download one ZIP:
          - GUI: WinCSVTool-0.1.0-win-x64-gui-portable.zip
          - CLI: WinCSVTool-0.1.0-win-x64-cli-portable.zip
          - GUI + CLI: WinCSVTool-0.1.0-win-x64-portable.zip

          Each ZIP includes the needed offline DB-IP Lite country/ASN reference data and its CC BY 4.0 attribution, software licenses, and README. Extract the whole ZIP before launching. No separate .NET installation is required.

          IMPORTANT: These executables are UNSIGNED. Source code is from a separately maintained public history; private development Issues, PRs and QA records are not included. XLSX exports preserve values, not formulas or formatting.

          SHA-256 (ZIP):
          NOTES
          grep '\.zip$' WinCSVTool-0.1.0-SHA256SUMS.txt >> release-notes.md
          gh release create v0.1.0             WinCSVTool-0.1.0-win-x64-gui-portable.zip             WinCSVTool-0.1.0-win-x64-cli-portable.zip             WinCSVTool-0.1.0-win-x64-portable.zip             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "WinCSVTool v0.1.0"             --notes-file release-notes.md
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" --json tagName,assets,url
